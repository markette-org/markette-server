    get:
      operationId: auth_sso_discover_retrieve
      description: Does this email sign in through an organization's identity provider?
      summary: Find the SSO provider for an email
      parameters:
      - in: query
        name: email
        schema:
          type: string
        description: The address being signed in
        required: true
      - in: query
        name: next
        schema:
          type: string
        description: Path to open after sign-in
      tags:
      - auth
      security:
      - apiToken: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/sso/exchange/:
    post:
      operationId: auth_sso_exchange_create
      description: 'Body: {"ticket": "…"} (from /sso/complete?ticket=…). Single use.'
      summary: Exchange an SSO ticket for tokens
      tags:
      - auth
      security:
      - apiToken: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordTokenRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/tokens/:
    get:
      operationId: auth_tokens_retrieve
      description: 'POST {"name": "…", "expires_in_days": 90} returns the token **once**
        in `token`.'
      summary: List or create personal API tokens
      tags:
      - auth
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: auth_tokens_create
      description: 'POST {"name": "…", "expires_in_days": 90} returns the token **once**
        in `token`.'
      summary: List or create personal API tokens
      tags:
      - auth
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/tokens/{token_id}/:
    delete:
      operationId: auth_tokens_destroy
      summary: Revoke a personal API token
      parameters:
      - in: path
        name: token_id
        schema:
          type: integer
        required: true
      tags:
      - auth
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/billing/organizations/{org_id}/:
    get:
      operationId: billing_organizations_retrieve
      summary: An organization's plan, subscription, limits and usage
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/organizations/{org_id}/checkout/:
    post:
      operationId: billing_organizations_checkout_create
      description: 'Body: {"plan": <id>}. Redirect the browser to the returned url.'
      summary: Start a Stripe Checkout
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/organizations/{org_id}/portal/:
    post:
      operationId: billing_organizations_portal_create
      summary: Open the Stripe customer portal
      parameters:
      - in: path
        name: org_id
        schema:
          type: integer
        required: true
      tags:
      - billing
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/billing/plans/:
    get:
      operationId: billing_plans_retrieve
      summary: Plans you can subscribe to
      tags:
      - billing
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/calendar/:
    get:
      operationId: calendar_list
      description: Everything scheduled or published in [start, end), one row per
        channel publication.
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - calendar
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarItem'
          description: ''
  /api/campaigns/:
    get:
      operationId: campaigns_list
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - campaigns
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaignList'
          description: ''
    post:
      operationId: campaigns_create
      tags:
      - campaigns
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignRequest'
        required: true
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
          description: ''
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
  /api/campaigns/{id}/:
    get:
      operationId: campaigns_retrieve
      parameters:
      - name: X-Workspace
        in: header
