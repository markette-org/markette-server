  /api/channels/:
    get:
      operationId: channels_list
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: provider
        schema:
          type: string
          enum:
          - bluesky
          - brevo
          - devto
          - discord
          - drupal
          - facebook
          - ghost
          - hugo
          - instagram
          - linkedin
          - listmonk
          - mastodon
          - medium
          - qq
          - reddit
          - slack
          - telegram
          - threads
          - webhook
          - wechat
          - whatsapp
          - wordpress
          - x
          - youtube
        description: |-
          * `x` - X
          * `bluesky` - Bluesky
          * `mastodon` - Mastodon
          * `linkedin` - LinkedIn
          * `facebook` - Facebook
          * `instagram` - Instagram
          * `telegram` - Telegram
          * `whatsapp` - WhatsApp
          * `wechat` - WeChat
          * `qq` - QQ
          * `threads` - Threads
          * `youtube` - YouTube
          * `reddit` - Reddit
          * `discord` - Discord
          * `slack` - Slack
          * `ghost` - Ghost
          * `brevo` - Brevo
          * `listmonk` - Listmonk
          * `webhook` - Webhook
          * `wordpress` - WordPress
          * `drupal` - Drupal
          * `medium` - Medium
          * `devto` - DEV
          * `hugo` - Hugo (git)
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - disabled
          - needs_reauth
        description: |-
          * `active` - Active
          * `needs_reauth` - Needs re-authentication
          * `disabled` - Disabled
      tags:
      - channels
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedChannelList'
          description: ''
