openapi: 3.0.3
info:
  title: Markette API
  version: 1.0.0
  description: |2

    The Markette REST API is what the Markette web app itself uses. With it you can publish, schedule and
    measure posts across social networks and websites from your own scripts and tools.

    ## Authentication

    Create a **personal API token** in *Settings → API & MCP* and send it with every request:

    ```
    Authorization: Bearer mkt_xxxxxxxxxxxxxxxxxxxxxxxx
    ```

    A token acts as you. It has your roles in every workspace, team channel access and approval rules
    included. Revoke it at any time from the same page. Short-lived JWTs (`POST /api/auth/token/`) are also
    accepted; they're what the web app uses.

    ## Workspaces

    Most endpoints work inside one workspace. Pass its slug in the **`X-Workspace`** header:

    ```
    X-Workspace: acme
    ```

    `GET /api/workspaces/` lists the workspaces you can use, with your role and the workspace time zone.

    ## Quick start

    ```bash
    TOKEN=mkt_…
    API=https://your-markette-host/api

    # 1. Your workspaces and channels
    curl -H "Authorization: Bearer $TOKEN" $API/workspaces/
    curl -H "Authorization: Bearer $TOKEN" -H "X-Workspace: acme" $API/channels/

    # 2. Create a draft for two channels (per-channel text is optional)
    curl -X POST -H "Authorization: Bearer $TOKEN" -H "X-Workspace: acme" -H "Content-Type: application/json" \
      -d '{"body": "We are live!", "targets": [{"channel": 12}, {"channel": 15, "body": "Short version for X"}]}' \
      $API/posts/

    # 3. Schedule it: now, at an exact time, in the next queue slot, or at each channel's best time
    curl -X POST -H "Authorization: Bearer $TOKEN" -H "X-Workspace: acme" -H "Content-Type: application/json" \
      -d '{"mode": "best_time", "window_start": "2026-10-12T08:00:00+02:00", "window_end": "2026-10-14T20:00:00+02:00"}' \
      $API/posts/42/schedule/
    ```

    A schedule call returns **202** instead of 200 when a team requires approval. The post is then waiting
    for a reviewer (`approval_status: "pending"`).

    ## Conventions

    * **Lists** are paginated with `?limit=` and `?offset=` and return `{count, next, previous, results}`. The
      calendar and queue slots return plain arrays.
    * **Times** are ISO 8601 with an offset. Stored and returned in UTC; the workspace time zone is used for
      queues, best times and analytics days.
    * **Errors** use standard HTTP codes. The body is `{"detail": "…"}` or `{"field": ["…"]}`.
      * 400: validation.
      * 401: missing or invalid credentials.
      * 403: role, archived workspace or suspended organization.
      * 404: not found, or not in your workspace.
      * 429: slow down.
    * **Media**: upload with `POST /api/media/` (multipart field `file`), then reference the returned ids in
      `media_ids`.

    ## MCP

    The same capabilities are available to AI assistants through the Model Context Protocol at `/mcp`, with the
    same tokens. See *Settings → API & MCP* for client setup.
paths:
  /api/analytics/audience/:
    get:
      operationId: analytics_audience_retrieve
      summary: Follower counts over time
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - in: query
        name: from
        schema:
          type: string
        description: YYYY-MM-DD
      - in: query
        name: to
        schema:
          type: string
        description: YYYY-MM-DD
      tags:
      - analytics
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/analytics/overview/:
    get:
      operationId: analytics_overview_retrieve
      summary: Totals, per-channel performance, daily series and top posts
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - in: query
        name: campaign
        schema:
          type: string
        description: Campaign id
      - in: query
        name: channels
        schema:
          type: string
        description: Comma-separated channel ids
      - in: query
        name: from
        schema:
          type: string
        description: 'Start date YYYY-MM-DD (default: 30 days ago)'
      - in: query
        name: team
        schema:
          type: string
        description: Team id
      - in: query
        name: to
        schema:
          type: string
        description: 'End date YYYY-MM-DD (default: today)'
      tags:
      - analytics
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/analytics/targets/{target_id}/:
    get:
      operationId: analytics_targets_retrieve
      summary: Metric history of one publication
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - in: path
        name: target_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - analytics
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/analytics/targets/{target_id}/refresh/:
    post:
      operationId: analytics_targets_refresh_create
      summary: Fetch fresh metrics for one publication now
      parameters:
      - name: X-Workspace
        in: header
        required: true
        description: Slug (or id) of the workspace to act in. List yours with `GET
          /api/workspaces/`.
        schema:
          type: string
          example: acme
      - in: path
        name: target_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - analytics
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Your profile
      tags:
      - auth
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Your profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - apiToken: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
