components:
  schemas:
    AdaptRequestRequest:
      type: object
      properties:
        channels:
          type: array
          items:
            type: integer
        body:
          type: string
          minLength: 1
        title:
          type: string
        instructions:
          type: string
      required:
      - body
      - channels
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - changes_requested
      type: string
      description: |-
        * `` - Not required
        * `pending` - Waiting for review
        * `approved` - Approved
        * `changes_requested` - Changes requested
    BlankEnum:
      enum:
      - ''
    CalendarItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        post_id:
          type: integer
        post_title:
          type: string
